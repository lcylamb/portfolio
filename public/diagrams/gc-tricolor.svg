<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="三色标记法：白色表示未访问，灰色表示已访问但子对象未扫完、是增量标记的断点，黑色表示自己和子对象都已扫完；写屏障拦截黑对象新增的白对象引用，把白改成灰">
  <defs>
    <marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d4d4d"/>
    </marker>
    <marker id="m5r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">

    <!-- 三种状态 -->
    <rect x="24" y="28" width="226" height="78" rx="7" fill="#ffffff" stroke="#b0b0b0"/>
    <text x="38" y="52" font-size="12.5" font-weight="bold">白色 · 还没被访问到</text>
    <text x="38" y="73" font-size="11" fill="#667085">标记结束时仍是白色 → 判定为垃圾</text>
    <text x="38" y="92" font-size="11" fill="#b85450">本轮清除掉</text>

    <rect x="266" y="28" width="226" height="78" rx="7" fill="#e0e0e0" stroke="#8a8a8a"/>
    <text x="280" y="52" font-size="12.5" font-weight="bold">灰色 · 自己访问了，子对象没扫完</text>
    <text x="280" y="73" font-size="11" fill="#5a5a5a">「处理了一半」的中间状态</text>
    <text x="280" y="92" font-size="11" fill="#5a5a5a">就是增量标记中断时的断点</text>

    <rect x="508" y="28" width="226" height="78" rx="7" fill="#3d3d3d" stroke="#1a1a1a"/>
    <text x="522" y="52" font-size="12.5" font-weight="bold" fill="#ffffff">黑色 · 自己和子对象都扫完了</text>
    <text x="522" y="73" font-size="11" fill="#d0d0d0">彻底处理完，不会再被回头看</text>
    <text x="522" y="92" font-size="11" fill="#d0d0d0">它指向的对象也已被覆盖</text>

    <!-- 引用链 -->
    <text x="24" y="152" font-size="12.5" font-weight="bold">标记中断时的堆快照</text>

    <rect x="24" y="196" width="88" height="46" rx="6" fill="#f5f5f5" stroke="#666666"/>
    <text x="68" y="224" text-anchor="middle" font-size="12">根对象</text>

    <rect x="160" y="196" width="88" height="46" rx="6" fill="#3d3d3d" stroke="#1a1a1a"/>
    <text x="204" y="224" text-anchor="middle" font-size="12" fill="#ffffff">A 黑</text>

    <rect x="296" y="196" width="88" height="46" rx="6" fill="#e0e0e0" stroke="#8a8a8a"/>
    <text x="340" y="224" text-anchor="middle" font-size="12">B 灰</text>

    <rect x="432" y="196" width="88" height="46" rx="6" fill="#ffffff" stroke="#b0b0b0"/>
    <text x="476" y="224" text-anchor="middle" font-size="12">C 白</text>

    <rect x="600" y="196" width="88" height="46" rx="6" fill="#ffffff" stroke="#b85450" stroke-dasharray="5 3"/>
    <text x="644" y="224" text-anchor="middle" font-size="12">D 白</text>

    <path d="M114 219 H156" fill="none" stroke="#4d4d4d" marker-end="url(#m5)"/>
    <path d="M250 219 H292" fill="none" stroke="#4d4d4d" marker-end="url(#m5)"/>
    <path d="M386 219 H428" fill="none" stroke="#4d4d4d" marker-end="url(#m5)"/>
    <text x="271" y="188" text-anchor="middle" font-size="11" fill="#5a5a5a">断点</text>

    <!-- 写屏障 -->
    <path d="M232 242 C 320 330, 580 330, 640 248" fill="none" stroke="#b85450" stroke-dasharray="6 4" marker-end="url(#m5r)"/>
    <text x="436" y="330" text-anchor="middle" font-size="11.5" fill="#b85450">写屏障：黑对象新增了白对象的引用 → 立刻把白改成灰，逼它进下一轮扫描</text>
  </g>
</svg>
