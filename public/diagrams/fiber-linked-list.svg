<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" aria-label="对比图：Stack Reconciler 的递归调用栈一旦开始无法中断；Fiber 用 child、sibling、return 三个指针把组件树拍平成链表，工作循环逐节点推进，可随时暂停">
  <defs>
    <marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d4d4d"/>
    </marker>
  </defs>
  <rect width="780" height="330" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">

    <text x="390" y="26" text-anchor="middle" font-size="12.5" font-weight="bold">「算到哪了」存在哪，决定了能不能停</text>

    <!-- 上：递归调用栈 -->
    <text x="190" y="54" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">Stack Reconciler：递归调用栈</text>
    <rect x="90" y="66" width="200" height="34" rx="5" fill="#f8cecc" stroke="#b85450"/>
    <text x="190" y="87" text-anchor="middle">App() → 递归进入 Child()</text>
    <rect x="90" y="108" width="200" height="34" rx="5" fill="#f8cecc" stroke="#b85450"/>
    <text x="190" y="129" text-anchor="middle">Child() → 递归进入 GrandChild()</text>
    <rect x="90" y="150" width="200" height="34" rx="5" fill="#f8cecc" stroke="#b85450"/>
    <text x="190" y="171" text-anchor="middle">GrandChild() …… 一路走到底</text>
    <text x="190" y="210" text-anchor="middle" font-size="11.5" fill="#667085">进度长在调用栈里，栈一断就丢</text>
    <text x="190" y="228" text-anchor="middle" font-size="11.5" fill="#667085">整树更新几十上百 ms，输入事件全部排队</text>

    <!-- 分隔 -->
    <path d="M390 50 V290" stroke="#d0d0d0" stroke-dasharray="6 5"/>

    <!-- 下：Fiber 链表 -->
    <text x="590" y="54" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#82b366">Fiber：child / sibling / return 链表</text>
    <rect x="470" y="70" width="60" height="34" rx="5" fill="#d5e8d4" stroke="#82b366"/>
    <text x="500" y="91" text-anchor="middle">App</text>
    <rect x="550" y="70" width="90" height="34" rx="5" fill="#d5e8d4" stroke="#82b366"/>
    <text x="595" y="91" text-anchor="middle">Child</text>
    <rect x="660" y="70" width="90" height="34" rx="5" fill="#d5e8d4" stroke="#82b366"/>
    <text x="705" y="91" text-anchor="middle">GrandChild</text>

    <path d="M530 87 L550 87" fill="none" stroke="#4d4d4d" marker-end="url(#m3)"/>
    <text x="540" y="78" text-anchor="middle" font-size="10" fill="#667085">child</text>
    <path d="M640 87 L660 87" fill="none" stroke="#4d4d4d" marker-end="url(#m3)"/>
    <text x="650" y="78" text-anchor="middle" font-size="10" fill="#667085">child</text>

    <path d="M470 104 L470 140 L570 140 L572 106" fill="none" stroke="#9673a6" stroke-dasharray="5 4" marker-end="url(#m3)"/>
    <text x="520" y="154" text-anchor="middle" font-size="10" fill="#9673a6">return（指回父节点，回溯用）</text>

    <!-- 工作循环 -->
    <rect x="470" y="180" width="220" height="40" rx="5" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="580" y="197" text-anchor="middle" font-size="11.5" font-weight="bold">工作循环：取一个节点，处理</text>
    <text x="580" y="213" text-anchor="middle" font-size="10.5">处理完看时间：还有预算 → 下一个；没有 → 存档让出</text>

    <path d="M580 106 L580 180" fill="none" stroke="#4d4d4d" marker-end="url(#m3)"/>
    <text x="592" y="140" font-size="10" fill="#667085">nextUnitOfWork = 当前节点</text>

    <text x="580" y="252" text-anchor="middle" font-size="11.5" fill="#667085">进度就是一个指针变量，停下来存好，回来接着走</text>
    <text x="580" y="270" text-anchor="middle" font-size="11.5" fill="#667085">长任务切成小块，不再独占主线程</text>

    <!-- 底部说明 -->
    <text x="24" y="312" font-size="11.5" fill="#667085">同一棵组件树：左边「父子关系」活在函数调用栈里；右边被拍平成链表，遍历顺序不变，但控制权回到了自己手里</text>
  </g>
</svg>
