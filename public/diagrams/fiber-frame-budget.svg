<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" aria-label="对比图：无切片时一次长 render 独占整帧，输入与绘制被阻塞；时间切片后 render 拆成小块放进每帧空闲时段，输入和绘制不再被饿死">
  <defs>
    <marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d4d4d"/>
    </marker>
  </defs>
  <rect width="780" height="330" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">

    <text x="390" y="26" text-anchor="middle" font-size="12.5" font-weight="bold">一帧 16.6ms，render 只是租客</text>
    <text x="390" y="44" text-anchor="middle" font-size="10.5" fill="#667085">每帧固定排队：事件处理 → JS → rAF 回调 → 样式 → 布局 → 绘制 → 剩余空闲</text>

    <!-- ===== 上：无切片 ===== -->
    <text x="90" y="72" text-anchor="middle" font-size="11.5" font-weight="bold">整块 render：独占若干整帧</text>

    <!-- 帧格子：两帧，几乎全红 -->
    <g>
      <text x="170" y="96" text-anchor="middle" font-size="10.5" fill="#667085">帧 1</text>
      <rect x="90" y="104" width="160" height="44" rx="4" fill="#ffffff" stroke="#6c8ebf"/>
      <rect x="90" y="104" width="140" height="44" fill="#f8cecc" stroke="#b85450"/>
      <text x="160" y="130" text-anchor="middle" font-size="11" fill="#333333">render 50ms</text>
      <rect x="230" y="104" width="20" height="44" fill="#d5e8d4" stroke="#82b366"/>
      <text x="170" y="164" text-anchor="middle" font-size="10" fill="#667085">用户点击？排队等它算完</text>
    </g>
    <g>
      <text x="410" y="96" text-anchor="middle" font-size="10.5" fill="#667085">帧 2</text>
      <rect x="330" y="104" width="160" height="44" rx="4" fill="#ffffff" stroke="#6c8ebf"/>
      <rect x="330" y="104" width="160" height="44" fill="#f8cecc" stroke="#b85450"/>
      <text x="410" y="130" text-anchor="middle" font-size="11" fill="#333333">render 继续独占</text>
      <rect x="490" y="104" width="20" height="44" fill="#e1d5e7" stroke="#9673a6"/>
      <text x="410" y="164" text-anchor="middle" font-size="10" fill="#667085">两帧过去了，画面还没更新</text>
    </g>

    <path d="M520 126 H560" fill="none" stroke="#4d4d4d" marker-end="url(#m5)"/>
    <text x="660" y="122" text-anchor="middle" font-size="11" fill="#b85450">输入延迟 + 掉帧</text>
    <text x="660" y="140" text-anchor="middle" font-size="10" fill="#667085">长任务饿死一切</text>

    <!-- 分隔 -->
    <path d="M40 190 H740" stroke="#d0d0d0" stroke-dasharray="6 5"/>

    <!-- ===== 下：时间切片 ===== -->
    <text x="90" y="214" text-anchor="middle" font-size="11.5" font-weight="bold">时间切片：render 拆成小块，插进空闲时间</text>

    <!-- 三帧，每帧：小事件+render小块+绘制+空闲 -->
    <g>
      <text x="150" y="238" text-anchor="middle" font-size="10.5" fill="#667085">帧 1</text>
      <rect x="70" y="246" width="160" height="44" rx="4" fill="#ffffff" stroke="#6c8ebf"/>
      <rect x="70" y="246" width="24" height="44" fill="#fff2cc" stroke="#d6b656"/>
      <rect x="94" y="246" width="52" height="44" fill="#d5e8d4" stroke="#82b366"/>
      <rect x="146" y="246" width="30" height="44" fill="#e1d5e7" stroke="#9673a6"/>
      <rect x="176" y="246" width="54" height="44" fill="#f5f5f5" stroke="#999999" stroke-dasharray="5 4"/>
      <text x="120" y="272" text-anchor="middle" font-size="10" fill="#333333">render 5ms</text>
    </g>
    <g>
      <text x="390" y="238" text-anchor="middle" font-size="10.5" fill="#667085">帧 2</text>
      <rect x="310" y="246" width="160" height="44" rx="4" fill="#ffffff" stroke="#6c8ebf"/>
      <rect x="310" y="246" width="24" height="44" fill="#fff2cc" stroke="#d6b656"/>
      <rect x="334" y="246" width="52" height="44" fill="#d5e8d4" stroke="#82b366"/>
      <rect x="386" y="246" width="30" height="44" fill="#e1d5e7" stroke="#9673a6"/>
      <rect x="416" y="246" width="54" height="44" fill="#f5f5f5" stroke="#999999" stroke-dasharray="5 4"/>
      <text x="360" y="272" text-anchor="middle" font-size="10" fill="#333333">render 5ms</text>
    </g>
    <g>
      <text x="630" y="238" text-anchor="middle" font-size="10.5" fill="#667085">帧 3</text>
      <rect x="550" y="246" width="160" height="44" rx="4" fill="#ffffff" stroke="#6c8ebf"/>
      <rect x="550" y="246" width="24" height="44" fill="#fff2cc" stroke="#d6b656"/>
      <rect x="574" y="246" width="52" height="44" fill="#d5e8d4" stroke="#82b366"/>
      <rect x="626" y="246" width="30" height="44" fill="#e1d5e7" stroke="#9673a6"/>
      <rect x="656" y="246" width="54" height="44" fill="#f5f5f5" stroke="#999999" stroke-dasharray="5 4"/>
      <text x="600" y="272" text-anchor="middle" font-size="10" fill="#333333">render 5ms</text>
    </g>

    <!-- 图例 -->
    <rect x="70" y="304" width="14" height="14" fill="#fff2cc" stroke="#d6b656"/>
    <text x="90" y="316" font-size="11" fill="#667085">事件</text>
    <rect x="140" y="304" width="14" height="14" fill="#d5e8d4" stroke="#82b366"/>
    <text x="160" y="316" font-size="11" fill="#667085">render 切片（用完预算就让出）</text>
    <rect x="356" y="304" width="14" height="14" fill="#e1d5e7" stroke="#9673a6"/>
    <text x="376" y="316" font-size="11" fill="#667085">绘制</text>
    <rect x="442" y="304" width="14" height="14" fill="#f5f5f5" stroke="#999999"/>
    <text x="462" y="316" font-size="11" fill="#667085">空闲（输入随时可进来，不再排队）</text>
  </g>
</svg>
