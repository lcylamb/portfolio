<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" width="760" height="286" role="img" aria-label="V8 分代回收总览：新生代用 Scavenge 复制算法与并行回收，老生代用标记清除、标记整理与增量标记，存活多次或占用超 25% 的对象晋升到老生代">
  <defs>
    <marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d4d4d"/>
    </marker>
  </defs>
  <rect width="760" height="286" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">

    <text x="40" y="30" font-size="13" font-weight="bold">V8 堆：按对象存活时间分代，两代用不同的算法和回收频率</text>

    <!-- 新生代 -->
    <rect x="40" y="56" width="260" height="150" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="58" y="82" font-size="13.5" font-weight="bold" fill="#2f5b85">新生代</text>
    <text x="120" y="82" font-size="11" fill="#4a6785">存活时间短 · 回收频繁</text>

    <rect x="58" y="110" width="100" height="46" rx="6" fill="#ffffff" stroke="#6c8ebf"/>
    <text x="108" y="131" text-anchor="middle" font-size="11.5">From</text>
    <text x="108" y="147" text-anchor="middle" font-size="10.5" fill="#4a6785">使用区</text>
    <rect x="170" y="110" width="112" height="46" rx="6" fill="#ffffff" stroke="#6c8ebf"/>
    <text x="226" y="131" text-anchor="middle" font-size="11.5">To</text>
    <text x="226" y="147" text-anchor="middle" font-size="10.5" fill="#4a6785">空闲区</text>

    <text x="58" y="182" font-size="11.5" fill="#2f5b85">Scavenge 复制算法 + 并行回收</text>

    <!-- 晋升 -->
    <path d="M304 131 H412" fill="none" stroke="#4d4d4d" marker-end="url(#m3)"/>
    <text x="358" y="122" text-anchor="middle" font-size="11.5" fill="#333333">晋升</text>

    <!-- 老生代 -->
    <rect x="420" y="56" width="300" height="150" rx="8" fill="#ffe6cc" stroke="#d79b00"/>
    <text x="438" y="82" font-size="13.5" font-weight="bold" fill="#8a5a00">老生代</text>
    <text x="500" y="82" font-size="11" fill="#946c22">存活时间长 · 回收频率低</text>

    <rect x="438" y="110" width="84" height="46" rx="6" fill="#ffffff" stroke="#d79b00"/>
    <text x="480" y="139" text-anchor="middle" font-size="11.5">标记清除</text>
    <rect x="532" y="110" width="84" height="46" rx="6" fill="#ffffff" stroke="#d79b00"/>
    <text x="574" y="139" text-anchor="middle" font-size="11.5">标记整理</text>
    <rect x="626" y="110" width="76" height="46" rx="6" fill="#ffffff" stroke="#d79b00"/>
    <text x="664" y="139" text-anchor="middle" font-size="11.5">增量标记</text>

    <text x="438" y="182" font-size="11.5" fill="#8a5a00">三色标记 + 写屏障（边标记边跑 JS）</text>

    <!-- 晋升条件 -->
    <text x="40" y="240" font-size="12" fill="#667085">晋升条件（满足其一）：① 经历多次 Scavenge 复制仍然存活　② 复制时 To 区占用会超过 25%</text>
    <text x="40" y="262" font-size="12" fill="#667085">大对象（如长数组、大字符串）不经过新生代，直接分配在老生代</text>
  </g>
</svg>
