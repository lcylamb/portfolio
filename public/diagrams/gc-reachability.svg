<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="标记清除法的可达性判断：从根对象出发能遍历到的对象被标记存活，遍历不到的循环引用对象被回收">
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d4d4d"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">

    <!-- 根对象 -->
    <rect x="28" y="140" width="140" height="64" rx="6" fill="#f5f5f5" stroke="#666666"/>
    <text x="98" y="167" text-anchor="middle" font-size="13">根对象</text>
    <text x="98" y="186" text-anchor="middle" font-size="11" fill="#666666">全局对象 / 调用栈</text>

    <!-- 可达对象 -->
    <rect x="260" y="36" width="120" height="50" rx="6" fill="#d5e8d4" stroke="#82b366"/>
    <text x="320" y="66" text-anchor="middle" font-size="13">objA</text>
    <rect x="460" y="36" width="120" height="50" rx="6" fill="#d5e8d4" stroke="#82b366"/>
    <text x="520" y="66" text-anchor="middle" font-size="13">objB</text>
    <rect x="260" y="200" width="120" height="50" rx="6" fill="#d5e8d4" stroke="#82b366"/>
    <text x="320" y="230" text-anchor="middle" font-size="13">objC</text>

    <!-- 不可达的循环引用 -->
    <rect x="580" y="110" width="130" height="48" rx="6" fill="#f8cecc" stroke="#b85450" stroke-dasharray="5 3"/>
    <text x="645" y="139" text-anchor="middle" font-size="13">objD</text>
    <rect x="580" y="214" width="130" height="48" rx="6" fill="#f8cecc" stroke="#b85450" stroke-dasharray="5 3"/>
    <text x="645" y="243" text-anchor="middle" font-size="13">objE</text>

    <!-- 引用关系 -->
    <path d="M168 158 H214 V61 H254" fill="none" stroke="#4d4d4d" marker-end="url(#m1)"/>
    <path d="M168 186 H214 V225 H254" fill="none" stroke="#4d4d4d" marker-end="url(#m1)"/>
    <path d="M380 61 H454" fill="none" stroke="#4d4d4d" marker-end="url(#m1)"/>
    <path d="M600 158 V208" fill="none" stroke="#b85450" stroke-dasharray="5 3" marker-end="url(#m1)"/>
    <path d="M690 214 V164" fill="none" stroke="#b85450" stroke-dasharray="5 3" marker-end="url(#m1)"/>
    <text x="645" y="191" text-anchor="middle" font-size="11" fill="#b85450">互相引用</text>

    <!-- 标注 -->
    <rect x="254" y="20" width="14" height="14" fill="#d5e8d4" stroke="#82b366"/>
    <text x="276" y="32" font-size="12" fill="#3f6b32">从根可以遍历到 → 标记为存活</text>
    <rect x="574" y="94" width="14" height="14" fill="#f8cecc" stroke="#b85450"/>
    <text x="596" y="106" font-size="12" fill="#b85450">遍历不到 → 是垃圾，回收</text>
    <text x="28" y="292" font-size="12" fill="#667085">objD 与 objE 互相引用、但都不在根对象的引用链上，所以都被回收 —— 引用计数法在这里失效</text>
  </g>
</svg>
